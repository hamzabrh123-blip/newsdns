<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ product.title|escapejs }}",
  "image": "https://res.cloudinary.com/dvoqsrkkq/image/fetch/f_auto,q_auto/{{ variants.0.image_url|default:product.variants.all.0.image_url }}",
  "description": "{{ product.title|escapejs|truncatechars:150 }}",
  "sku": "{{ variants.0.variant_code|default:product.variants.all.0.variant_code|default:'N/A' }}",
  "brand": {
    "@type": "Brand",
    "name": "Uttar World Elite Lifestyle Store"
  },
  "offers": {
    "@type": "Offer",
    "url": "{{ request.build_absolute_uri }}",
    "priceCurrency": "{% if product.currency == '$' %}USD{% elif product.currency == '€' %}EUR{% else %}INR{% endif %}",
    "price": "{% if variants.0.selling_price %}{{ variants.0.selling_price }}{% elif variants.0.mrp_price %}{{ variants.0.mrp_price }}{% elif product.selling_price %}{{ product.selling_price }}{% else %}{{ product.mrp_price|default:'0' }}{% endif %}",
    "priceValidUntil": "2026-12-31",
    "itemCondition": "https://schema.org/NewCondition",
    "availability": "https://schema.org/InStock",
    "hasMerchantReturnPolicy": {
      "@type": "MerchantReturnPolicy",
      "applicableCountry": "IN",
      "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
      "merchantReturnDays": 10
    },
    "shippingDetails": {
      "@type": "OfferShippingDetails",
      "shippingRate": { 
        "@type": "MonetaryAmount", 
        "value": "0", 
        "currency": "{% if product.currency == '$' %}USD{% elif product.currency == '€' %}EUR{% else %}INR{% endif %}" 
      },
      "shippingDestination": { 
        "@type": "DefinedRegion", 
        "addressCountry": "IN" 
      },
      "deliveryTime": {
        "@type": "ShippingDeliveryTime",
        "handlingTime": { "@type": "QuantitativeValue", "minValue": 1, "maxValue": 2 },
        "transitTime": { "@type": "QuantitativeValue", "minValue": 3, "maxValue": 7 }
      }
    }
  },
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "4.5",
    "reviewCount": "55"
  }
}
</script>
