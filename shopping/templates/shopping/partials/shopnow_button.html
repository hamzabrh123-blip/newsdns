{% load amazon_filters %}
<style>
#masterShopNowBtn {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 12px !important;
    width: 100% !important;
    min-height: 58px !important;
    padding: 12px 20px !important;
    text-decoration: none !important;
    border-radius: 12px !important;
    font-weight: 900 !important;
    cursor: pointer !important;
    position: relative !important;
    overflow: hidden !important;
    z-index: 5 !important;
    border: none !important;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.6) !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease !important;
}
#masterShopNowBtn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -80%;
    width: 60%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    transform: rotate(25deg);
    pointer-events: none;
    animation: sunRayFocusMove 3s infinite linear;
}
@keyframes sunRayFocusMove {
    0% { left: -80%; }
    100% { left: 140%; }
}
#masterShopNowBtn:hover { transform: translateY(-2px); }
</style>
<a href="{% if variants.0.earn_karo_url and variants.0.earn_karo_url != 'None' %}{% if 'amazon' in variants.0.earn_karo_url %}{{ variants.0.earn_karo_url|clean_amazon }}{% else %}{{ variants.0.earn_karo_url }}{% endif %}{% else %}{% if 'amazon' in product.earn_karo_url %}{{ product.earn_karo_url|clean_amazon }}{% else %}{{ product.earn_karo_url|default:'#' }}{% endif %}{% endif %}" 
    id="masterShopNowBtn" 
    data-product-id="{{ product.id }}"
    data-variant-id="{{ variants.0.id|default:'' }}"
    data-store-name="{{ variants.0.store_name|default:product.store_name|default:'' }}"
    target="_blank" 
    rel="nofollow noopener"
    style="background: {% with store=variants.0.store_name|default:product.store_name|lower %}{% if 'ajio' in store %}#111111{% elif 'myntra' in store %}#ff3f6c{% elif 'meesho' in store %}#8f37bc{% elif 'hamara' in store %}#059669{% elif 'flipkart' in store %}#2874f0{% elif 'kerala' in store or 'ayurveda' in store %}#065f46{% elif 'libas' in store %}#be185d{% else %}linear-gradient(135deg, #ffd814 0%, #ff9900 100%){% endif %}{% endwith %}; color: {% if 'amazon' in variants.0.store_name|default:product.store_name|lower %}#111{% else %}#fff{% endif %};">
    <span id="btnTextLabel" style="font-size: 19px; font-weight: 900; letter-spacing: 0.5px; pointer-events: none;">SHOP NOW AT</span>
    <img id="btnStoreLogo" src="/static/store_logo/{{ variants.0.store_name|default:product.store_name|default:'amazon'|lower|slugify }}.png" 
         onerror="this.style.display='none'; document.getElementById('fallbackStoreName').style.display='inline';" 
         alt="Store Logo" style="height: 28px; object-fit: contain;">
    <span id="fallbackStoreName" style="display:none; font-size: 19px; font-weight: 900; text-transform: uppercase; pointer-events: none;">{{ variants.0.store_name|default:product.store_name|default:'STORE' }}</span>
</a>

<script>
function updateStoreButtonColor(storeName) {
    const btn = document.getElementById('masterShopNowBtn');
    if (!btn) return;
    
    const s = (storeName || "").toLowerCase().trim();
    let textColor = "#fff";
    let bgStyle = "";

    if (s.includes('ajio')) {
        bgStyle = "#111111"; // Jet Black
    } else if (s.includes('myntra')) {
        bgStyle = "#ff3f6c"; // Hot Pink / Red
    } else if (s.includes('meesho')) {
        bgStyle = "#3ac1dc"; // Royal Purple
    } else if (s.includes('hamara') || s.includes('hamaramall')) {
        bgStyle = "#e84ff6"; // Rich Emerald Green (Unique & Fresh)
    } else if (s.includes('flipkart')) {
        bgStyle = "#2874f0"; // Electric Blue
    } else if (s.includes('kerala') || s.includes('ayurveda')) {
        bgStyle = "#065f46"; // Deep Forest Teal
    } else if (s.includes('libas')) {
        bgStyle = "#be185d"; // Vibrant Magenta
    } else {
        // Amazon / Default
        bgStyle = "linear-gradient(135deg, #de2915 0%, #e8e877 100%)";
        textColor = "#111";
    }

    btn.style.background = bgStyle;
    btn.style.color = textColor;
}

// Page load par initial store name ke hisab se color set karo
window.addEventListener('load', function() {
    const initialStore = "{{ variants.0.store_name|default:product.store_name|default:'amazon' }}";
    updateStoreButtonColor(initialStore);
    sendTrackingData('HOME_VISIT', '', '');
});

// Jab variant change ho toh syncVariant ya is function ko store name pass kar dena
// Ya hum syncVariant ke andar se bhi isko call kar sakte hain.
</script>
