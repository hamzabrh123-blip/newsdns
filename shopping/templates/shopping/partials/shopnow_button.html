{% load amazon_filters %}
<style>
#masterShopNowBtn {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 12px !important;
    width: 100% !important;
    min-height: 58px !important;
    padding: 12px 20px !important;
    text-decoration: none !important;
    border-radius: 12px !important;
    font-weight: 900 !important;
    cursor: pointer !important;
    position: relative !important;
    overflow: hidden !important;
    z-index: 5 !important;
    border: none !important;
    box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15), inset 0 2px 4px rgba(255, 255, 255, 0.6) !important;
    transition: transform 0.2s ease, box-shadow 0.2s ease !important;
}
#masterShopNowBtn::after {
    content: '';
    position: absolute;
    top: -50%;
    left: -80%;
    width: 60%;
    height: 200%;
    background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.6), transparent);
    transform: rotate(25deg);
    pointer-events: none;
    animation: sunRayFocusMove 3s infinite linear;
}
@keyframes sunRayFocusMove {
    0% { left: -80%; }
    100% { left: 140%; }
}
#masterShopNowBtn:hover { transform: translateY(-2px); }
</style>

<a href="{% if variants.0.earn_karo_url and variants.0.earn_karo_url != 'None' %}{% if 'amazon' in variants.0.earn_karo_url %}{{ variants.0.earn_karo_url|clean_amazon }}{% else %}{{ variants.0.earn_karo_url }}{% endif %}{% else %}{% if 'amazon' in product.earn_karo_url %}{{ product.earn_karo_url|clean_amazon }}{% else %}{{ product.earn_karo_url|default:'#' }}{% endif %}{% endif %}" 
    id="masterShopNowBtn" 
    data-product-id="{{ product.id }}"
    data-variant-id="{{ variants.0.id|default:'' }}"
    data-store-name="{{ variants.0.store_name|default:product.store_name|default:'' }}"
    target="_blank" 
    rel="nofollow noopener"
    style="background: linear-gradient(135deg, #ffd814 0%, #ff9900 100%); color: #111;">
    <span id="btnTextLabel" style="font-size: 19px; font-weight: 900; letter-spacing: 0.5px; pointer-events: none;">SHOP NOW AT</span>
    <img id="btnStoreLogo" src="/static/store_logo/{{ variants.0.store_name|default:product.store_name|default:'amazon'|lower|slugify }}.png" 
         onerror="this.style.display='none'; document.getElementById('fallbackStoreName').style.display='inline';" 
         alt="Store Logo" style="height: 28px; object-fit: contain;">
    <span id="fallbackStoreName" style="display:none; font-size: 19px; font-weight: 900; text-transform: uppercase; pointer-events: none;">{{ variants.0.store_name|default:product.store_name|default:'STORE' }}</span>
</a>

<script>
function getTrafficSource() {
    const userAgent = navigator.userAgent.toLowerCase();
    const referrer = document.referrer.toLowerCase();
    const urlParams = new URLSearchParams(window.location.search);
    
    if (userAgent.includes("wv") || userAgent.includes("uttarworldapp") || window.cefQuery || window.AndroidBridge) {
        return 'Android App (WebView)';
    }
    if (urlParams.has('utm_source')) {
        return 'App/Campaign (' + urlParams.get('utm_source') + ')';
    }
    if (!referrer || referrer === "") {
        return 'Direct Visit / Browser';
    } else if (referrer.includes('google.com')) {
        return 'Google Search';
    } else if (referrer.includes('instagram.com')) {
        return 'Instagram';
    } else if (referrer.includes('facebook.com') || referrer.includes('fb.me')) {
        return 'Facebook';
    } else if (referrer.includes('pinterest.com')) {
        return 'Pinterest';
    } else if (referrer.includes('youtube.com')) {
        return 'YouTube';
    } else if (referrer.includes('whatsapp.com') || referrer.includes('wa.me')) {
        return 'WhatsApp';
    } else {
        return 'Other Site (' + new URL(referrer).hostname + ')';
    }
}

function getDeviceType() {
    return (navigator.userAgent.match(/Mobi/i)) ? 'Mobile' : 'Desktop';
}

window.addEventListener('load', function() {
    sendTrackingData('HOME_VISIT', '', '');
});

document.getElementById("masterShopNowBtn")?.addEventListener("click", function () {
    const btn = this;
    sendTrackingData('SHOP_CLICK', btn.dataset.productId || "", btn.dataset.variantId || "");
});

function sendTrackingData(eventType, productId, variantId) {
    const csrfToken = document.querySelector("[name=csrfmiddlewaretoken]")?.value || '';
    fetch('/api/log-event/', {
        method: 'POST',
        credentials: 'same-origin',
        keepalive: true,
        headers: {
            'Content-Type': 'application/json',
            'X-CSRFToken': csrfToken
        },
        body: JSON.stringify({
            event_type: eventType,
            product_id: productId,
            variant_id: variantId,
            traffic_source: getTrafficSource(),
            device_type: getDeviceType()
        })
    }).catch(err => console.log('Tracking error:', err));
}
</script>
