<style>
/* Image Zoom Container */
.img-zoom-container {
    position: relative;
    width: 100%;
    display: block;
    margin: 0;
    padding: 0;
}
.img-zoom-lens {
    position: absolute;
    border: 1px solid #d4d4d4;
    width: 80px;
    height: 80px;
    background-color: rgba(255, 255, 255, 0.4);
    display: none;
    z-index: 10;
    cursor: crosshair;
    pointer-events: none;
}
.img-zoom-result {
    border: 1px solid #d4d4d4;
    width: 500px;
    height: 500px;
    position: absolute;
    top: 0;
    left: 102%;
    z-index: 100;
    background-repeat: no-repeat;
    display: none;
    background-color: #fff;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
}
</style>

<div class="row">
    <!-- Desktop Thumbnails -->
    <div class="col-md-2 d-none d-md-block">
        {% for variant in variants %}
            <img src="{{ variant.image_url }}" 
                 class="thumb-img {% if forloop.first %}thumb-active{% endif %}" 
                 data-raw-url="{{ variant.image_url }}" 
                 data-video-url="{% if variant.video_url and variant.video_url != 'None' and variant.video_url != 'null' %}{{ variant.video_url }}{% endif %}"
                 data-code="{{ variant.variant_code }}" 
                 data-variant-id="{{ variant.id }}"
                 data-selling-price="{{ variant.selling_price|default:'' }}"
                 data-mrp-price="{{ variant.mrp|default:variant.mrp_price|default:'' }}"
                 data-store-name="{{ variant.store_name|default:product.store_name|default:'' }}"
                 data-size="{{ variant.size|default:product.default_size|default:'Free Size' }}"
                 data-colour="{{ variant.colour|default:product.default_color|default:'Standard' }}"
                 data-url="{% if variant.earn_karo_url and variant.earn_karo_url != 'None' %}{{ variant.earn_karo_url }}{% else %}{{ product.earn_karo_url|default:'#' }}{% endif %}"
                 onmouseover="syncVariant(this)"
                 onclick="syncVariant(this)"
                 alt="{{ product.title }}" style="width: 60px; height: 60px; object-fit: cover; margin-bottom: 8px; cursor: pointer; border-radius: 6px; border: 1px solid #ddd;">
        {% endfor %}
    </div>
    
    <div class="col-md-10">
        <!-- Media Switcher Tabs -->
        <div class="d-flex justify-content-center mb-2" id="mediaSwitcherTab" style="gap: 10px; display: none !important;">
            <button type="button" class="btn btn-sm btn-dark active" id="showImgBtn" onclick="switchMedia('image')" style="border-radius: 20px; font-weight: 600; font-size: 12px;">
                <i class="bi bi-image"></i> Photo
            </button>
            <button type="button" class="btn btn-sm btn-outline-dark" id="showVideoBtn" onclick="switchMedia('video')" style="border-radius: 20px; font-weight: 600; font-size: 12px;">
                <i class="bi bi-play-btn"></i> Video
            </button>
        </div>

        <!-- Image Viewport -->
        <div class="img-zoom-container" id="viewport" style="display: block;">
            <div class="main-img-viewport" style="position: relative;">
                <img id="mainProductImg" src="{{ variants.0.image_url }}" alt="{{ product.title }}" style="width: 100%; border-radius: 8px; object-fit: contain; max-height: 480px;">
                <div id="lens" class="img-zoom-lens"></div>
            </div>
            <div id="zoomResult" class="img-zoom-result"></div>
        </div>

        <!-- Video Viewport -->
        <div id="videoViewport" style="display: none; width: 100%;">
            <video id="mainProductVideo" src="" controls loop playsinline style="width: 100%; max-height: 480px; border-radius: 8px; object-fit: cover;"></video>
        </div>

        <!-- Mobile Thumbnails -->
        <div class="d-flex d-md-none mt-3" style="overflow-x: auto; gap: 10px; padding-bottom: 10px;">
            {% for variant in variants %}
                <img src="{{ variant.image_url }}" 
                     class="thumb-img {% if forloop.first %}thumb-active{% endif %}" 
                     data-raw-url="{{ variant.image_url }}" 
                     data-video-url="{% if variant.video_url and variant.video_url != 'None' and variant.video_url != 'null' %}{{ variant.video_url }}{% endif %}"
                     data-code="{{ variant.variant_code }}" 
                     data-variant-id="{{ variant.id }}"
                     data-selling-price="{{ variant.selling_price|default:'' }}"
                     data-mrp-price="{{ variant.mrp|default:variant.mrp_price|default:'' }}"
                     data-store-name="{{ variant.store_name|default:product.store_name|default:'' }}"
                     data-size="{{ variant.size|default:product.default_size|default:'Free Size' }}"
                     data-colour="{{ variant.colour|default:product.default_color|default:'Standard' }}"
                     data-url="{% if variant.earn_karo_url and variant.earn_karo_url != 'None' %}{{ variant.earn_karo_url }}{% else %}{{ product.earn_karo_url|default:'#' }}{% endif %}"
                     onmouseover="syncVariant(this)"
                     onclick="syncVariant(this)"
                     alt="{{ product.title }}" style="width: 50px; height: 50px; object-fit: cover; border-radius: 6px; border: 1px solid #ddd; flex-shrink: 0;">
            {% endfor %}
        </div>
    </div>
</div>
