<!-- Open Graph / Facebook Meta Tags -->
<title>{{ product.title|truncatechars:60 }}</title>
<meta name="description" content="{{ product.meta_description|truncatechars:160 }}">

<meta property="og:type" content="product">
<meta property="og:title" content="{{ product.title|truncatechars:60 }}">
<meta property="og:description" content="{{ product.meta_description|truncatechars:160 }}">

{% if product.variants.first.image_url %}
<meta property="og:image" content="https://res.cloudinary.com/dvoqsrkkq/image/fetch/c_fit,w_600,h_315,q_auto/{{ product.variants.first.image_url }}">
{% endif %}

<meta property="og:image:width" content="600">
<meta property="og:image:height" content="315">
<meta property="og:url" content="https://www.uttarworld.com{{ request.path }}">

<!-- Twitter Card Meta Tags -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ product.title|truncatechars:60 }}">
<meta name="twitter:description" content="{{ product.meta_description|truncatechars:160 }}">

{% if product.variants.first.image_url %}
<meta name="twitter:image" content="https://res.cloudinary.com/dvoqsrkkq/image/fetch/c_fit,w_600,h_315,q_auto/{{ product.variants.first.image_url }}">
{% endif %}
