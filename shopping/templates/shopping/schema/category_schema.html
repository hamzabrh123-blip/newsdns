<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "{{ category.name|escapejs }}",
  "description": "{{ category.meta_description|default:category.description|striptags|truncatechars:300|escapejs }}",
  {% if category.image_url %}
  "image": "{{ category.image_url|escapejs }}",
  {% endif %}
  {% if category.keywords %}
  "keywords": "{{ category.keywords|escapejs }}",
  {% endif %}
  "url": "https://uttarworld.com{{ request.path }}",
  "mainEntity": {
    "@type": "ItemList",
    "itemListElement": [
      {% for item in products|slice:":20" %}
        {% with prod=item.product var=item.variant %}
          {% if prod and prod.title and var %}
      {
        "@type": "ListItem",
        "position": {{ forloop.counter }},
        "item": {
          "@type": "Product",
          "name": "{{ prod.title|escapejs }}",
          "url": "https://uttarworld.com{% url 'product_detail' prod.slug %}",
          {% if var.image_url %}
          "image": "{{ var.image_url|escapejs }}",
          {% elif prod.image_url %}
          "image": "{{ prod.image_url|escapejs }}",
          {% endif %}
          "offers": {
            "@type": "Offer",
            "priceCurrency": "{% if prod.currency == '₹' or prod.currency == 'INR' %}INR{% elif prod.currency == '$' or prod.currency == 'USD' %}USD{% elif prod.currency == '€' or prod.currency == 'EUR' %}EUR{% else %}{{ prod.currency|default:'INR'|escapejs }}{% endif %}",
            "price": "{{ item.selling_price|default:'0' }}",
            "availability": "https://schema.org/InStock",
            "url": "https://uttarworld.com{% url 'product_detail' prod.slug %}"
          }
        }
      }{% if not forloop.last %},{% endif %}
          {% endif %}
        {% endwith %}
      {% endfor %}
    ]
  }
}
</script>
