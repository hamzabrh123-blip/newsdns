<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "CollectionPage",
  "name": "{{ category.name|escapejs }}",
  "description": "{{ category.meta_description|default:category.description|striptags|truncatechars:300|escapejs }}",
  "url": "https://www.uttarworld.com{{ request.path }}",
  "mainEntity": {
    "@type": "ItemList",
    "itemListElement": [
      {% for product in products|slice:":20" %}
        {% with first_variant=product.variants.first %}
          {% with first_coupon=first_variant.coupons.first %}
            {% if product.title and first_coupon and first_coupon.selling_price %}
      {
        "@type": "ListItem",
        "position": {{ forloop.counter }},
        "item": {
          "@type": "Product",
          "name": "{{ product.title|escapejs }}",
          "url": "{{ request.scheme }}://{{ request.get_host }}{{ product.get_absolute_url }}"
          {% if first_variant.image_url %}
          ,
          "image": "{{ first_variant.image_url }}"
          {% endif %}
          ,
          "offers": {
            "@type": "Offer",
            "priceCurrency": "{{ product.currency }}",
            "price": "{{ first_coupon.selling_price }}",
            "availability": "https://schema.org/InStock",
            "url": "{{ request.scheme }}://{{ request.get_host }}{{ product.get_absolute_url }}"
          }
        }
      }{% if not forloop.last %},{% endif %}
            {% endif %}
          {% endwith %}
        {% endwith %}
      {% endfor %}
    ]
  }
}
</script>
