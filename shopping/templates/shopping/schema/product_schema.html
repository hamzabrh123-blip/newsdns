<script type="application/ld+json">
{
  "@context": "https://schema.org/",
  "@type": "Product",
  "name": "{{ product.title|escapejs }}",
  {% with first_variant=product.variants.first %}
    {% if first_variant and first_variant.image_url %}
  "image": "{{ first_variant.image_url }}",
    {% elif product.image_url %}
  "image": "{{ product.image_url }}",
    {% endif %}
  "sku": "{{ first_variant.variant_code|default:product.id }}",
  {% endwith %}
  "description": "{{ product.meta_description|default:product.title|striptags|truncatechars:160|escapejs }}",
  {% if product.meta_keywords %}
  "keywords": "{{ product.meta_keywords|escapejs }}",
  {% endif %}
  "brand": {
    "@type": "Brand",
    "name": "Uttar World Elite Lifestyle Store"
  },
  {% if product.video_url %}
  "subjectOf": {
    "@type": "VideoObject",
    "name": "{{ product.title|escapejs }} - Product Video",
    "description": "{{ product.meta_description|default:product.title|striptags|truncatechars:160|escapejs }}",
    "thumbnailUrl": "{% with first_variant=product.variants.first %}{{ first_variant.image_url|default:product.image_url }}{% endwith %}",
    "uploadDate": "2026-01-01T08:00:00+05:30",
    "contentUrl": "{{ product.video_url }}",
    "embedUrl": "{{ product.video_url }}"
  },
  {% endif %}
  "aggregateRating": {
    "@type": "AggregateRating",
    "ratingValue": "{{ product.rating|default:'4.5' }}",
    "reviewCount": "{{ product.review_count|default:'15' }}"
  },
  "offers": {
    "@type": "Offer",
    "url": "https://www.uttarworld.com{{ request.path }}",
    "priceCurrency": "INR",
    {% with first_variant=product.variants.first %}
    "price": "{% if first_variant and first_variant.selling_price %}{{ first_variant.selling_price }}{% else %}{{ product.selling_price|default:product.mrp_price|default:'499' }}{% endif %}",
    {% endwith %}
    "priceValidUntil": "2026-12-31",
    "itemCondition": "https://schema.org/NewCondition",
    "availability": "{% if product.is_available %}https://schema.org/InStock{% else %}https://schema.org/OutOfStock{% endif %}",
    "hasMerchantReturnPolicy": {
      "@type": "MerchantReturnPolicy",
      "applicableCountry": {
        "@type": "Country",
        "name": "IN"
      },
      "returnPolicyCategory": "https://schema.org/MerchantReturnFiniteReturnWindow",
      "merchantReturnDays": 10,
      "returnMethod": "https://schema.org/ReturnByMail",
      "returnFees": "https://schema.org/FreeReturn"
    },
    "shippingDetails": {
      "@type": "OfferShippingDetails",
      "shippingRate": {
        "@type": "MonetaryAmount",
        "value": "0",
        "currency": "INR"
      },
      "shippingDestination": {
        "@type": "DefinedRegion",
        "addressCountry": {
          "@type": "Country",
          "name": "IN"
        }
      },
      "deliveryTime": {
        "@type": "ShippingDeliveryTime",
        "handlingTime": {
          "@type": "QuantitativeValue",
          "minValue": 1,
          "maxValue": 2,
          "unitCode": "DAY"
        },
        "transitTime": {
          "@type": "QuantitativeValue",
          "minValue": 3,
          "maxValue": 7,
          "unitCode": "DAY"
        }
      }
    }
  }
}
</script>
